name: trainme        # prefix unik agar tidak bentrok dengan project lain
 
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
 
  app:
    image: ghcr.io/<OWNER>/<PROJECT>-app:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    volumes: [storage:/var/www/html/storage/app]
    networks: [internal]
    mem_limit: 384m
 
  nginx:
    image: ghcr.io/<OWNER>/<PROJECT>-nginx:${TAG:-latest}
    restart: unless-stopped
    depends_on: [app]
    ports: ["127.0.0.1:<PORT_API>:80"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - storage:/var/www/html/storage/app:ro
    networks: [internal]
    mem_limit: 64m
 
