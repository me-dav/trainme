# Local development:   docker compose up -d db        (then: php artisan serve)
# Full stack:          docker compose up -d --build   (app on http://localhost:8080)
# Values come from .env in this directory.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dojo}
      POSTGRES_USER: ${DB_USERNAME:-dojo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: devops-dojo:local
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      DB_HOST: db
      DB_PORT: "5432"
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:${APP_FORWARD_PORT:-8080}:8080"
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/bootstrap/cache:uid=10001,gid=10001,mode=0750
      - /config/caddy:uid=10001,gid=10001,mode=0700
      - /data/caddy:uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  dbdata:
  storage:
